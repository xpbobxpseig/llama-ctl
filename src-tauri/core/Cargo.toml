[package]
name = "llama-ctl-core"
version = "0.2.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }
windows-registry = "0.6.1"
windows-result = "0.4.1"
# Upstream zips are deflate-compressed; `deflate` is the only compressor we
# need. Everything else (bzip2/zstd/lzma/time) is off so no codec we never see
# is compiled in.
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0.154"
